services:
  pg:
    image: postgres:16-alpine
    container_name: parser_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rental_parser}
      POSTGRES_USER: ${POSTGRES_USER:-rental_parser_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser_password_secure_123}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - parser_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rental_parser_user} -d ${POSTGRES_DB:-rental_parser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: parser_adminer
    ports:
      - "8082:8080"
    networks:
      - parser_net
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    container_name: rental_parser_app
    ports:
      - "8002:8000"
    depends_on:
      pg:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.app_main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - parser_net

  bot:
    build: .
    container_name: rental_parser_bot
    depends_on:
      pg:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "python -m bot.bot_main"

    networks:
      - parser_net

networks:
  parser_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
